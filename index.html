<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>网盘配置中心</title>
<style>
:root{--bg:#0f1115;--card:#171a21;--line:#252a34;--text:#e6e8ee;--muted:#9aa3b2;--ok:#3ddc97;--bad:#ff6b6b;--brand:#5b8cff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding:24px}
.wrap{max-width:860px;margin:0 auto}h1{font-size:22px;margin:0 0 4px}.sub{color:var(--muted);font-size:13px;margin-bottom:20px}
.token{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;margin-bottom:20px;word-break:break-all}
.token b{color:var(--brand)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
.card h2{margin:0 0 6px;font-size:17px;display:flex;align-items:center;gap:10px}
.state{font-size:12px;padding:2px 10px;border-radius:99px;background:#2a2f3a;color:var(--muted)}
.state.ok{background:rgba(61,220,151,.14);color:var(--ok)}.state.bad{background:rgba(255,107,107,.14);color:var(--bad)}
textarea{width:100%;height:96px;background:#0d1016;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;resize:vertical}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
button{background:var(--brand);border:0;color:#fff;padding:8px 16px;border-radius:8px;font-size:14px;cursor:pointer}
button.ghost{background:#2a2f3a;color:var(--text)}
button:disabled{opacity:.5;cursor:not-allowed}
.hint{color:var(--muted);font-size:12px;margin-top:10px;line-height:1.7}
.hint code{background:#0d1016;padding:1px 5px;border-radius:4px;color:#ffd580}
.msg{margin-top:10px;font-size:13px;min-height:18px}.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
</style>
</head>
<body>
<div class="wrap">
<h1>网盘配置中心</h1>
<div class="sub">登录网盘后，TV 站点源可直接播放网盘资源，无需在电视上登录。</div>

<div class="token">访问令牌 <b id="t"></b><br><span style="color:var(--muted)">TV 配置里的 hub 地址需带上它，请勿外传。</span></div>

<div class="card">
  <h2>夸克网盘 <span class="state" id="q-state">检查中</span></h2>
  <textarea id="q-cookie" placeholder="粘贴 pan.quark.cn 的 Cookie（含 __pus / __puus）"></textarea>
  <div class="row"><button id="q-save">保存并验证</button><button class="ghost" id="q-clear">清除</button></div>
  <div class="msg" id="q-msg"></div>
  <div class="hint">电脑浏览器打开 <code>pan.quark.cn</code> 并登录 → F12 → Network → 任选一个请求 → Request Headers 里复制完整 <code>cookie</code> 值。</div>
</div>

<div class="card">
  <h2>百度网盘 <span class="state" id="b-state">检查中</span></h2>
  <textarea id="b-cookie" placeholder="粘贴 pan.baidu.com 的 Cookie，或只粘贴 BDUSS 值"></textarea>
  <div class="row"><button id="b-save">保存并验证</button><button class="ghost" id="b-clear">清除</button></div>
  <div class="msg" id="b-msg"></div>
  <div class="hint">浏览器打开 <code>pan.baidu.com</code> 并登录 → F12 → Network → 复制完整 <code>cookie</code>（含 BDUSS、STOKEN）。<b>非 SVIP 直链会严重限速</b>，建议用夸克。</div>
</div>

<div class="card">
  <h2>试解析</h2>
  <textarea id="test-url" placeholder="粘贴一个分享链接，如 https://pan.quark.cn/s/xxxx"></textarea>
  <div class="row"><input id="test-code" placeholder="提取码（可空）" style="flex:1;min-width:120px;background:#0d1016;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 10px"><button id="test-run">解析</button></div>
  <div class="msg" id="test-msg"></div>
</div>
</div>

<script>
const token = new URLSearchParams(location.search).get("token") || "";
document.getElementById("t").textContent = token || "（缺失，请在网址后加 ?token=xxx）";
const api = (path, options = {}) => fetch(path + (path.includes("?") ? "&" : "?") + "token=" + encodeURIComponent(token), options).then(r => r.json());

function setState(id, text, kind) {
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = "state" + (kind ? " " + kind : "");
}
function setMsg(id, text, ok) {
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = "msg " + (text ? (ok ? "ok" : "bad") : "");
}

async function refresh() {
  const data = await api("/api/status");
  for (const key of ["quark", "baidu"]) {
    const item = data.providers?.[key] || {};
    if (!item.logged) setState(key[0] + "-state", "未登录", "bad");
    else if (item.expired) setState(key[0] + "-state", "已失效", "bad");
    else setState(key[0] + "-state", (item.name || "已登录") + (item.vip ? " · SVIP" : ""), "ok");
  }
}

function bind(key, provider) {
  document.getElementById(key + "-save").onclick = async () => {
    const button = document.getElementById(key + "-save");
    button.disabled = true;
    setMsg(key + "-msg", "验证中…");
    const data = await api("/api/login", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({provider, cookie: document.getElementById(key + "-cookie").value}),
    });
    setMsg(key + "-msg", data.ok ? `已登录：${data.name || ""}` : data.error, data.ok);
    button.disabled = false;
    refresh();
  };
  document.getElementById(key + "-clear").onclick = async () => {
    await api("/api/logout", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({provider})});
    document.getElementById(key + "-cookie").value = "";
    setMsg(key + "-msg", "已清除");
    refresh();
  };
}

document.getElementById("test-run").onclick = async () => {
  const button = document.getElementById("test-run");
  button.disabled = true;
  setMsg("test-msg", "解析中（首次会转存，请稍候）…");
  const url = document.getElementById("test-url").value.trim();
  const code = document.getElementById("test-code").value.trim();
  const data = await api(`/api/resolve?url=${encodeURIComponent(url)}&code=${encodeURIComponent(code)}`);
  if (data.ok) setMsg("test-msg", `${data.name || "已解析"}\n${data.stream}`, true);
  else setMsg("test-msg", data.error + (data.detail ? "\n" + JSON.stringify(data.detail).slice(0, 200) : ""), false);
  button.disabled = false;
};

bind("q", "quark");
bind("b", "baidu");
refresh();
</script>
</body>
</html>
